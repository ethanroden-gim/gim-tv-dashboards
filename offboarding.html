  :root{

    --bg:#0b0b0b;
    --panel:#151515;
    --ink:#ffffff;
    --ink-muted:#a9a9a4;
    --hairline:#2c2c2a;

    /* status palette (validated for contrast, distinct from brand green) */

    --status-pending:#ec835a;
    --status-complete:#0ca30c;
    --status-other:#898781;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    width:100%;
    height:100%;
    margin:0;
    background:#000;
    overflow:hidden;
  }

     actual TV/browser viewport is. */

    position:absolute;
    top:0; left:0;
    width:1920px;
    height:1080px;
    transform-origin: 0 0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Cinzel','Copperplate','Copperplate Gothic Light',serif;
    overflow:hidden;
    display:grid;
    grid-template-rows: 136px 1fr 90px;
    grid-template-columns: 1fr;
  }

  /* ---------- HEADER ---------- */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 44px;
    border-bottom:3px solid var(--gim-green);
    background:linear-gradient(180deg, #101010 0%, #0b0b0b 100%);
  }
  .brand{ display:flex; align-items:center; gap:20px; }
  .brand-mark{ height:78px; width:auto; display:block; }
  .title-block h1{
    font-family:'Alfa Slab One', serif;
    font-size:38px;
    color:var(--ink);
    letter-spacing:1.2px;
    line-height:1.25;
    text-shadow: 0 2px 0 rgba(0,0,0,0.55), 0 0 18px rgba(255,255,255,0.10);
    -webkit-text-stroke: 0.4px rgba(0,0,0,0.35);
  }
  .title-block .subtitle{
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size:16px;
    font-weight:600;
    color:rgba(255,255,255,0.62);
    letter-spacing:1.2px;
    text-transform:uppercase;
    margin-top:10px;
  }
  .updated{
    text-align:right;
    font-size:15px;
    color:var(--ink-muted);
    letter-spacing:1px;
  }
  .updated .dot{
    display:inline-block;
    width:9px;height:9px;
    border-radius:50%;
    background:var(--gim-green);
    margin-right:8px;
    box-shadow:0 0 8px var(--gim-green);
  }

  /* ---------- MAIN TABLE AREA ---------- */
  main{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:0;
    padding:26px 44px 10px 44px;
  }
  .col{ display:flex; flex-direction:column; }
  .col + .col{
    border-left:1px solid var(--hairline);
    margin-left:28px;
    padding-left:28px;
  }

  table{ width:100%; border-collapse:collapse; table-layout:fixed; }
  thead th{
    text-align:left;
    font-size:15px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--gim-green);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-weight:700;
    padding:0 10px 12px 10px;
    border-bottom:2px solid var(--gim-green);
    white-space:nowrap;
  }

  tbody td{
    padding:14px 10px;
    border-bottom:1px solid var(--hairline);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size:20px;
    vertical-align:middle;
  }
  tbody tr:last-child td{ border-bottom:none; }

  td.assoc{ font-weight:600; letter-spacing:0.2px; }
  td.end-date{
    color:var(--ink-muted);
    font-variant-numeric: tabular-nums;
    font-size:18px;
    white-space:nowrap;
  }
  td.notes{
    color:var(--ink-muted);
    font-size:16px;
    font-style:italic;
  }
  td.notes.empty::before{ content:"—"; opacity:0.5; }

  .status-pill{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:4px 10px;
    border-radius:16px;
    font-size:12px;
    font-weight:700;
    letter-spacing:0.3px;
    text-transform:uppercase;
    white-space:nowrap;
    margin-right:8px;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .status-pill .swatch{ width:8px;height:8px; border-radius:50%; flex:none; }

  .status-in-progress{ background:rgba(250,178,25,0.15); color:#fab219; }
  .status-in-progress .swatch{ background:var(--status-in-progress); }

  .status-pending{ background:rgba(236,131,90,0.18); color:#f3a37e; }
  .status-pending .swatch{ background:var(--status-pending); }

  .status-complete{ background:rgba(12,163,12,0.18); color:#4ade4a; }
  .status-complete .swatch{ background:var(--status-complete); }

  .status-other{ background:rgba(137,135,129,0.15); color:#c9c8c3; }
  .status-other .swatch{ background:var(--status-other); }

  /* Rows whose End Date has already passed get an overall red wash,
     regardless of status, to flag them for review. */
  tr.row-overdue td{
    background: rgba(208,59,59,0.18);
  }
  tr.row-overdue td.assoc{
    color:#ffb3b3;
  }
  tr.row-overdue td.end-date{
    color:#ff8f8f;
    font-weight:600;
  }

  th.col-assoc{ width:34%; }
  th.col-end{ width:110px; }
  th.col-status{ width:234px; }
  th.col-notes{ width:auto; }

  /* Safety net: even a slightly-too-long status label clips inside its own
     cell instead of visually bleeding into the Notes column next to it. */
  tbody td:nth-child(3){ overflow:hidden; }

  /* ---------- FOOTER (kept minimal — no summary math requested) ---------- */
  footer{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 44px;
    border-top:3px solid var(--gim-green);
    background:linear-gradient(0deg, #101010 0%, #0b0b0b 100%);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size:16px;
    letter-spacing:1px;
    color:var(--ink-muted);
    text-transform:uppercase;
  }
  footer #footer-count{ color:var(--gim-green); font-weight:700; margin-right:6px; }
</style>
</head>

              <th class="col-end">End Date</th>
              <th class="col-status">Status</th>

<script>
// ---- Live data, pulled from the Apps Script Web App bound to the sheet ----
// The script reads the Offboarding tab directly (values *and* cell
// background colors), so a manually-highlighted row in the sheet is
// reflected here automatically on the next 5-minute refresh. See the
// ?page=offboarding-feed branch of doGet(e) in the sheet's Apps Script
// project (Code.gs).
const OFFBOARDING_DATA_URL = "https://script.google.com/macros/s/AKfycbwSuSkqimnGEBeoq1pX5lOPEHbEEgIj9vpnjGRYQ8hBtqBESbBtLOMjFAtdKtqQPkJqpg/exec?page=offboarding-feed";

let ROWS = [];

function formatDate(s){
  const d = new Date(s);
  if (isNaN(d)) return s;
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric' });
}

// Converts a sheet fill color like "#ffff00" into a low-alpha overlay so the
// highlight reads as a tint rather than a flat block on the dark theme.
function hexToRgba(hex, alpha){
  if (!hex) return null;
  let h = hex.replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16);
  if (isNaN(n)) return null;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return `rgba(${r},${g},${b},${alpha})`;
}

async function loadData(){
  try {
    const url = OFFBOARDING_DATA_URL + (OFFBOARDING_DATA_URL.includes('?') ? '&' : '?') + 'cachebust=' + Date.now();
    const res = await fetch(url);
    if (!res.ok) throw new Error(`Data fetch failed: HTTP ${res.status}`);
    const data = await res.json();

    const parsed = (data.rows || []).map(r => {
      const rawEnd = (r.end || '').trim();
      const endDateObj = new Date(rawEnd);
      return {
        assoc: (r.assoc || '').trim(),
        end: formatDate(rawEnd),
        endDate: isNaN(endDateObj) ? null : endDateObj,
        status: (r.status || '').trim(),
        notes: (r.notes || '').trim(),
        highlight: r.highlight || null
      };
    });
    ROWS = parsed;
    render();
    document.getElementById('updated-time').textContent = new Date().toLocaleString('en-US', {
      month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit'
    });
  } catch (err){
    console.error('Failed to load offboarding data', err);
  }
}

const STATUS_CLASS = {
  "In Progress":"status-in-progress",
  "Pending Response":"status-pending",
  "Complete":"status-complete",
};

function rowHtml(r){
  const cls = STATUS_CLASS[r.status] || "status-other";
  const notesEmpty = !r.notes;
  const today = new Date();
  today.setHours(0,0,0,0);
  const overdue = r.endDate && r.endDate < today;

  // A manual highlight in the sheet takes visual priority over the
  // computed "overdue" red wash; both paint the same way (a tinted
  // background on every cell), just with a different source color.
  const tint = r.highlight ? hexToRgba(r.highlight, 0.24) : (overdue ? 'rgba(208,59,59,0.18)' : null);
  const tdStyle = tint ? ` style="background:${tint}"` : '';
  const overdueCls = (overdue && !r.highlight) ? ' row-overdue' : '';

  return `<tr class="${overdueCls}">
    <td class="assoc"${tdStyle}>${r.assoc}</td>
    <td class="end-date"${tdStyle}>${r.end}</td>
    <td${tdStyle}><span class="status-pill ${cls}"><span class="swatch"></span>${r.status}</span></td>
    <td class="notes${notesEmpty ? ' empty' : ''}"${tdStyle}>${r.notes || ''}</td>
  </tr>`;
}

function render(){
  const mid = Math.ceil(ROWS.length / 2);
  document.getElementById('table-a').innerHTML = ROWS.slice(0, mid).map(rowHtml).join('');
  document.getElementById('table-b').innerHTML = ROWS.slice(mid).map(rowHtml).join('');
  document.getElementById('footer-count').textContent = ROWS.length;
}

loadData();
setInterval(loadData, 5 * 60 * 1000); // re-fetch every 5 minutes (picks up new highlights), no full page reload

// ---- Scale-to-fit: see the invoice-automation dashboard for the full rationale. ----
function fitStage(){
  const stage = document.getElementById('stage');
  const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  const x = (window.innerWidth - 1920 * scale) / 2;
  const y = (window.innerHeight - 1080 * scale) / 2;
  stage.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
}
window.addEventListener('resize', fitStage);
window.addEventListener('load', fitStage);
fitStage();
// Some TV/webview renderers report incorrect window dimensions on the very
// first paint (before the display has finished negotiating resolution), or
// never fire a resize event at all. Re-run a few times after load and then
// keep a cheap periodic safety check running for the life of the page.
setTimeout(fitStage, 500);
setTimeout(fitStage, 2000);
setInterval(fitStage, 5000);
</script>
